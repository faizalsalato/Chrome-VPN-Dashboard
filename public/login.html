<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Chrome/VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // Respeita o tema salvo (evita "flash" de tema errado ao carregar o login).
    // Padrao: claro (tema rubilax.online).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>🔒 Dashboard</h1>
        <p>Chrome/VPN Manager</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            maxlength="64"
            autocomplete="username"
            required
            placeholder="Digite seu usuário"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            maxlength="128"
            autocomplete="current-password"
            required
            placeholder="Digite sua senha"
          >
        </div>

        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-full">
          <span class="btn-text">Entrar</span>
          <span class="btn-loading hidden">
            <span class="spinner"></span> Autenticando...
          </span>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
