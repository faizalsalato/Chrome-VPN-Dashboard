<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Chrome/VPN</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>🔒 Dashboard</h1>
        <p>Chrome/VPN Manager</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            maxlength="64"
            autocomplete="username"
            required
            placeholder="Digite seu usuário"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            maxlength="128"
            autocomplete="current-password"
            required
            placeholder="Digite sua senha"
          >
        </div>

        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-full">
          <span class="btn-text">Entrar</span>
          <span class="btn-loading hidden">
            <span class="spinner"></span> Autenticando...
          </span>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
